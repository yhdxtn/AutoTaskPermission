<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台登录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --text: #182033;
      --muted: #69758b;
      --line: #dbe3ee;
      --brand: #1768ac;
      --danger: #c73535;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(380px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(24, 32, 51, .10);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 22px; color: var(--muted); }
    label {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    input, button {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    input {
      padding: 0 11px;
      color: var(--text);
      background: #fff;
    }
    button {
      margin-top: 8px;
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .error {
      display: none;
      margin-bottom: 14px;
      color: var(--danger);
      font-size: 14px;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>后台登录</h1>
    <p>自动任务助手管理后台</p>
    <div class="error" id="error">账号、密码错误，或账号已过期/禁用。</div>
    <form method="post" action="/admin/login">
      <label>
        账号
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登录</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
      document.querySelector('#error').classList.add('visible');
    }
  </script>
</body>
</html>
